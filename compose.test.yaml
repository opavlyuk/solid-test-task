name: solid-test-task-tests

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: payment_service_test
      POSTGRES_USER: payment_service_test
      POSTGRES_PASSWORD: local_test_password
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
