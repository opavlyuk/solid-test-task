[alembic]
script_location = %(here)s/migrations
path_separator = os

[post_write_hooks]
hooks = ruff-check, ruff-format
ruff-check.type = module
ruff-check.module = ruff
ruff-check.options = check --fix --config "%(here)s/pyproject.toml" REVISION_SCRIPT_FILENAME
ruff-format.type = module
ruff-format.module = ruff
ruff-format.options = format --config "%(here)s/pyproject.toml" REVISION_SCRIPT_FILENAME
