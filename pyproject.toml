[project]
name = "payment-service"
version = "0.1.0"
description = "Payment endpoint take-home task"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "apiflask>=3.1.2,<4",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pre-commit-hooks>=6,<7",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
    "ty>=0.0.1,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
    "integration: tests that require external services such as PostgreSQL",
]
